<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>投资者说明</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0" />
    <link rel="stylesheet" href="/WeixinWeb/WeixinWeb_Css/publicNew.css" />
    <link rel="stylesheet" href="/WeixinWeb/WeixinWeb_Css/styleNew.css" />
    <script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/jqueryNew.min.js"></script>
    <script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/commonsNew.js"></script>
    <script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/freedomNew.js"></script>
    <script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/idangerous.swiper-2.1New.min.js"></script>
    <script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/sliderNew.js"></script>
    <style type="text/css"></style>
    <script>
      (function() {
        $.ajax({
          async: false,
          url: "/WeixinService/business/queryUserinfo.xhtml",
          data: "",
          dataType: "json",
          cache: false,
          type: "post",
          error: function(textStatus, errorThrown) {
            errorRemark("网络繁忙，请稍后再试。");
          },
          success: function(data) {
            //投资者类型及状态
            var invprtp = data.invprtp;
            var appst = data.appst;
            var invprtpScore = data.invprtpScore;
            if (data.userType == null || data.userType != "30") {
              errorRemark("请您完成实名认证");
              window.location.href = "/#/cardinfo";
              return;
            }

            if (invprtp == 1 || invprtp == "1") {
              // 申请状态 N 待处理  I 处理中 Y 申请成功 C 申请失败
              if (appst == "N" || appst == "I") {
                //invprtpStr = '普通投资者（专业投资者申请中）';
                window.location.href = "/WeixinService/business/user/materialReviewPageNew.shtml";
              } else if (appst == "C") {
                // 页面加载完执行
                $(function() {
                  // 申请未通过
                  $("#hint_01").show();
                })
              }
            } else if (invprtp == 0 || invprtp == "0") {
              invprtpScore = parseInt(invprtpScore);
              if (invprtpScore < 60 || invprtpScore == null || invprtpScore == "") {
                //invprtpStr = "普通投资者（专业投资者证明材料已审核通过，请进行投资知识评估）";
                window.location.href = "/WeixinService/business/user/materialReviewPageNew.shtml?pic=2";
              } else {
                //invprtpStr = "专业投资者（申请转为普通投资者）";
                window.location.href = "/WeixinService/business/user/specialtyInvprExplainNew.shtml";
              }
            }
          }
        });
      })();
    </script>
  </head>
  <body style="background-color: rgb(245, 245, 245);">
    <section class="page" id="specialty_context">
      <div id="scroller"></div>
      <!--#include virtual="/WeixinService/headerOrFooter/headerNew.shtml"-->
      <section class="title" id="section_0">
        <div style="background: #fff;margin-top: 10px;padding-bottom: 10px;">
          <h2 style="font-size: 15px;border-bottom: 1px solid #F2F2F2;height: 45px;line-height: 45px; margin: 0 20px 0 20px;color: #4c4c4c;">
            当前为普通投资者：
          </h2>
          <p style="margin: 5px 20px 5px 20px; line-height: 23px;font-size: 14px;color: #a1a1a1;">
            普通投资者在信息告知、风险警示、适当性匹配等方面享有特别保护。是否申请转为专业投资者？
          </p>
        </div>
        <div class="btn-state">
          <a href="javascript:backUserInfoPage();" class="btn-back">我的</a>
          <a href="javascript:goAppLyInvprPage();" class="btn-golden">申请转换</a>
        </div>
      </section>
    </section>
    <div class="cover-bg" id="hint_01" style="display: none;">
      <div class="cover-point" style="top: 35%;">
        <div class="cover-point-text mid">
          <div style="margin: 35px auto 25px;font-size: 14px;text-align: center; width: 100%;">您的专业投资者材料未通过审核。</div>
        </div>
        <span class="cover-point-bottom" onclick="closeHint();" style="color: #C49A63">我知道了</span>
      </div>
    </div>
    <!-- <script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/pageReq/riskLevelNew.js"></script> -->
    <!-- <script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/pageReq.min/riskLevelNew.min.js"></script> -->
    <script>
      $(function() {
        $(".header .top-a h2").html("投资者说明");
        document.title = "投资者说明";
      });

      /**
       * 跳转至专业投资者申请页面
       */
      function goAppLyInvprPage() {
        $.ajax({
          async: false,
          url: "/WeixinService/business/queryUserinfo.xhtml",
          data: "",
          dataType: "json",
          cache: false,
          type: "post",
          error: function(textStatus, errorThrown) {
            errorRemark("网络繁忙，请稍后再试。");
          },
          success: function(data) {
            //投资者类型及状态
            var invprtp = data.invprtp;
            var appst = data.appst;
            var invprtpScore = data.invprtpScore;
            if (data.userType == null || data.userType != "30") {
              errorRemark("请您完成实名认证");
              window.location.href = "/#/cardinfo";
              return;
            }
            // 0 专业用户 1 普通用户
            if (invprtp == "" || invprtp == null) {
              //invprtpStr = '普通投资者（可申请为专业投资者）';
              //跳转至申请专业投资者页面
              window.location.href = "/WeixinService/business/user/applySpecialtyInvNew.shtml";
            } else if (invprtp == 1 || invprtp == "1") {
              // 申请状态 N 待处理  I 处理中 Y 申请成功 C 申请失败
              if (appst == "N" || appst == "I") {
                //invprtpStr = '普通投资者（专业投资者申请中）';
                window.location.href = "/WeixinService/business/user/materialReviewPageNew.shtml";
              } else if (appst == "C") {
                // 申请未通过
                $("#hint_01").show();
              } else {
                //跳转至申请专业投资者页面
                window.location.href = "/WeixinService/business/user/applySpecialtyInvNew.shtml";
              }
            } else if (invprtp == 0 || invprtp == "0") {
              invprtpScore = parseInt(invprtpScore);
              if (invprtpScore < 60 || invprtpScore == null || invprtpScore == "") {
                //invprtpStr = "普通投资者（专业投资者证明材料已审核通过，请进行投资知识评估）";
                window.location.href = "/WeixinService/business/user/materialReviewPageNew.shtml?pic=2";
              } else {
                //invprtpStr = "专业投资者（申请转为普通投资者）";
                window.location.href = "/WeixinService/business/user/specialtyInvprExplainNew.shtml";
              }
            }
          }
        });
        // window.location.href = "/WeixinService/business/user/applySpecialtyInvNew.shtml";
      }

      /**
       * 返回用户管理页面
       */
      function backUserInfoPage() {
        window.location.href = "/#/myAccount";
      }
      /**
       * 申请未通过，点击知道了
       */
      function closeHint() {
        $.ajax({
          async: !1,
          url: "/WeixinService/business/clearAppcvInvp.xhtml",
          data: {
            apptp: "0"
          },
          dataType: "json",
          cache: !1,
          type: "POST",
          error: function() {
            show_tips("网络繁忙，请稍后再试。");
          },
          success: function(n) {
            $("#hint_01").hide();
            location.href = "/#/myAccount";
          }
        });
      }
    </script>
  </body>
</html>
