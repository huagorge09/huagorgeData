<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
		<link rel="stylesheet" href="/WeixinWeb/WeixinWeb_Css/mgm/mgmPromotionActNew.css">
		<title>推荐好友</title>
	</head>
	<body>

		<div class="header"></div>

        <div class="center">
			<div class="recommendTip">
			</div>
			<div class="nameBox">
				<span class="nameIcon">姓名</span>
				<input id="customerName" placeholder="请输入好友姓名" />
			</div>
			<div class="phoneBox">
				<span class="phoneIcon">电话</span>
				<input id="customerMobile"  placeholder="请输入好友电话" maxlength="11"/>
			</div>
		</div>
		<!--  提交按钮 -->
		<div class="submitBtn" id="submitBtn" onclick="recommendSubmit()">
			提交推荐
		</div>
		<!-- 二维码部分 -->
		<img class="wxQrCode" src="/WeixinWeb/WeixinWeb_Images/mgm/wxToRulePageCode.png" id="codeImg"/>

		<!-- 实名鉴权弹框 -->
		<div class="realNamePop" id="realNamePop" style="display: none;">
			<div class="content">
				<p class="phoneTip">请您完成实名鉴权</p>

			</div>
			<div class="realNameBtn">
				<span class="firstLookBtn">先看看</span><span class="toRealBtn">去实名</span>
			</div>

		</div>
		
		
		<!--  推荐完成弹框 -->
		<div style=" display: none;" class="recommendPop">
			<!-- 弹出框顶部 -->
			<div class="popHead">
				<span class="popTitle">提示</span><span class="closeIcon" onclick="closePop()"></span>
			</div>
			<!-- 推荐提示 -->
			<div class="popTip">
				<p class="hasBeUser oneLine" >您推荐的朋友已经是我们的客户</p>
				<p class="pipDetail twoLine">您的顾问将在24小时内联系您的朋友</p>
				<p class=" threeLine">感谢您的支持</p>
			</div>
			<!-- 按钮区域 -->
			<div class="popBottom">
				<span class="knowedButton" onclick="closePop()">知道了</span>
			</div>
		</div>


		<div class="backLayer" style="display: none;"></div>


		<script src="/WeixinWeb/WeixinWeb_JSLibrary/jquery-2.0.0New.min.js" type="text/javascript"></script>
		<script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/jweixin-1.0.0New.js"></script>
		<script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/shareNew.js"></script>
		<!-- 常用JS文件 -->
		<script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/commonsNew.js"></script>
		<script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/flexibleNew.min.js"></script>
		<!--<script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/pageReq/mgmPromotionActNew.js"></script> 
		 <script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/pageReq.min/mgmPromotionActNew.min.js"></script>-->
		
 		<script type="text/javascript">
 			//document.write('<script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/pageReq/mgmPromotionActNew.js?version='+new Date().getTime()+'"><\/script>');
			document.write('<script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/pageReq.min/mgmPromotionActNew.min.js?version='+new Date().getTime()+'"><\/script>');
		</script> 
	</body>
</html>
