<!--预约信息填写-->
<div class="cover-bg reserves hide">

		<div class="form">

				<li>
					<div class="inputBox">
						<span></span> <input type="text" id="userName" name="userName" placeholder="请输入您的姓名"/>
					</div>
					<p style="display: none;"></p>
				</li>
				<li class="foucs">

<style>
	body{

		width: 100%;

	}
	.guide .title {
	    position: absolute;

	    background: url(/WeixinWeb/WeixinWeb_Images/H5modules/cfb203/title2.png) no-repeat;

	    left: 7%;
	    top: 20%;
	}
	.proBox{
	    position: absolute;

	    height: 3.51rem;

		    text-align: left;
      padding-left: .75rem;
	}

	    text-align: center;
	}
	.loginSee {
	    position: absolute;
	    top: 58%;
	    color: #936222;
	    left: 19%;
    }
    .reserves ul p {
	    text-align: inherit;
	    position: initial;
	}
	.guide .center {
	    position: absolute;
	    width: 5.98rem;
	    height: 5.94rem;
	    background: url(/WeixinWeb/WeixinWeb_Images/H5modules/cfb203/center2.png) no-repeat;
	    background-size: 90% 90%;

	    top: 67%;

    	    z-index: 999999;

</style>
 <script>
	var pageSource=getUrlParams("tel").tel
	var pageId="messageCfb203"
	$(function(){
		cmwaOnkeyup("userName;mobilePhone",checkAppoInfoParam);
		elemBind();
	 	operatingRecord(pageSource,"openMessagePage",pageId,"","","","")
	});
	/* 验证输入框的有效性  */
	function checkAppoInfoParam(){
		var userName = $("#userName").val();
		var mobilePhone = $("#mobilePhone").val();
		if(userName == null || userName == ""){
			$("#saveBtn").addClass("disabled").attr("onclick","");
			return;
		}else if(mobilePhone == null || mobilePhone == ""){
			$("#saveBtn").addClass("disabled").attr("onclick","");
			return;
		}else{
			$("#saveBtn").removeClass("disabled").attr("onclick","saveAppointInfo()");
		}
	}
    /*
     * 预约提交
     */
	function seeProduct() {
        bussiness();
    }
	
	/*
	 * 用户信息提交
	 */
	function userDateSumbit(userName,mobilePhone){
		$.ajax({
				async : false,
				url:apiHost + "/api/insertAppointInfo",
				type : "post",
				dataType : 'json',
				data : {
					"userName":userName,
					"mobilePhone":mobilePhone,
					"productType":"cfb203",
					"cmfUserId":""
				},
				success : function(data) {
					if(data.success){
						$(".reserves").addClass("hide")
						$(".success").removeClass("hide")
						$("input[name=userName]").val('');
						$("input[name=mobilePhone]").val('');
						$("#saveBtn").addClass("disabled").attr("onclick","");
					   operatingRecord(pageSource,"makeMessageSuccess",pageId,"","","","")
					}else{
						errorRemark(data.msg);
					}
				},
				error : function() {
					errorRemark("网络繁忙，请稍后再试。");
				},
			});
	}
	/**
	 * 元素事件绑定
	 */
	function elemBind(){
	    //鼠标键盘弹起
		$("input").keyup(function(){
			if($("input[name=userName]").val()!==""&&$("input[name=mobilePhone]").val()!==""){
				$("button").removeClass("disabled");
			}
		});
	     //输入框光标事件
		$("input").focus(function(){
			$(this).parents("div").addClass("foucs");
			$(this).parents("li").find("p").hide().text("")
		});
		$("input").blur(function(){
			$(this).parents("div").removeClass("foucs");
		});
	
		//弹窗关闭
		$(".close").click(function(){
			$(".cover-bg").addClass("hide");
			$("input[name=userName]").val('');
			$("input[name=mobilePhone]").val('');
	        $(".reserves li p").hide();
	        $("body,html").css({"overflow":"auto","height":"auto"}); 
	        $("#saveBtn").addClass("disabled").attr("onclick","");
		})
	
	}
	
	//点击信息提交
	function saveAppointInfo(){
			var userName=$.trim($("input[name=userName]").val());
			var mobilePhone=$.trim($("input[name=mobilePhone]").val());
			var flag=true;
			if(userName==""||!ischinese(userName)){
				$("input[name=userName]").parents("li").find("p").show().text("请输入2-10字中文姓名");
				flag=false;
			}	
			if (!isMobile(mobilePhone)) {
				$("input[name=mobilePhone]").parents("li").find("p").show().text("请输入正确的手机号码");
				flag=false;
			}
			
			if(flag){
				userDateSumbit(userName,mobilePhone);
			}
	}
	
	
	function ischinese(name){
	    return /^[\u2E80-\u9FFF]{2,10}$/.test(name)
	}  
	
	 //验证手机号
	function  isMobile(phone) {
	        return /^0?(13[0-9]|15[0123456789]|18[0123456789]|14[0123456789]|17[0123456789])[0-9]{8}$/.test(phone);
	}
	/**
	 * 预约
	 */
	function bussiness(){	
		 operatingRecord(pageSource,"clickAppointment",pageId,"","","","")
		 $(".reserves").removeClass("hide");
		 $("body,html").css({"overflow":"auto","height":"100%"}); 
	}
    function myAdviser(){
        location.href = "/WeixinService/sendMessage/cfb203/bussinessCard.html?pageSource=" + pageSource + "&eventId=event_cfb203_adviserId"
    }
 </script>
</body>
