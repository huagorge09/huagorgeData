<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
	<link rel="stylesheet" href="/WeixinWeb/WeixinWeb_Css/public.css">
	<link rel="stylesheet" href="/WeixinWeb/WeixinWeb_Css/style.css">

	<script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/jquery-init.min.js"></script>
	<script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/flexible.min.js"></script>
	<script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/commons.js"></script>
	<script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/freedom.js"></script>
	<script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/H5modules/js/header.js"></script>

</head>
<body>
<div class="guide">
    <div class="guide1">
        <p>招商财富年终奖理财</p>
        <p>1.01<sup style="font-size: .16rem;">365</sup>≈37.8 >>1<br>不足为道的0.01，正拉开你我财<br>富间的差距。就算1.01，也将积<br>攒成无穷大的力量！</p>
    </div>
    <div class="guide2">
        <h1></h1>
        <div class="product">
            <table border="0" cellspacing="1" cellpadding="1" class="table">
            	<tr>
            		<th>产品系列</th>
            		<th>收益情况</th>
            		<th>起投金额</th>
            	</tr>
            	<tr>
            		<td>7天管家系列</td>
            		<td>立即预约</td>
            		<td>30万</td>
            	</tr>
            	<tr>
            		<td>长利系列</td>
            		<td>立即预约</td>
            		<td>30万</td>
            	</tr>
            	<tr>
            		<td>
            			<p>财富宝理财FOF系列</p>
            			<p>（1/3/4/6/9/12个月）</p>
            		</td>
            		<td>立即预约</td>
            		<td>30万</td>
            	</tr>
            </table>
            <a href="javascript:;" class="loginSee" onclick="seeProduct()">立即预约</a>
        </div>
    </div>
</div>
<div class="bottom clearFloat">
	<a href="javascript:;" onclick="bussiness();" id="myBtn1">我感兴趣</a>
	<a href="javascript:;" onclick="myAdviser();" id="myBtn2">我的顾问</a>
</div>

<!--预约信息填写-->
<div class="cover-bg reserves hide">
	<div class="content">
		<span class="close"></span>
		<h1>一键预约享专属服务<br>让投资无后顾之忧</h1>
		<h3>我们的专属顾问将24小时内给您回电</h3>
		<div class="form">
			<ul>
				<li>
					<div class="inputBox">
						<span></span> <input type="text" id="userName" name="userName" placeholder="请输入您的姓名"/>
					</div>
					<p style="display: none;"></p>
				</li>
				<li class="foucs">
					<div class="inputBox">
						<span></span> <input type="tel" id="mobilePhone" name="mobilePhone" maxlength="11" placeholder="请输入您的手机号码"/>
					</div>
					<p  style="display: none;"></p>
				</li>

			</ul>
			<button id="saveBtn"  class="disabled">立即提交</button>
		</div>
	</div>
</div>
<!-- 错误提示 -->
<div id="errorDiv" class="cover-opacity hide" onclick="errorRemarkHide();">
	<span id="errorRemark"></span>
</div>
<!--预约成功-->
<div class="cover-bg success hide">
	<div class="content center">
		<span class="close"></span>
		<div class="successIcon"></div>
		<h2>预约成功</h2>
		<p>客户经理将尽快与您联系，请保持电话畅通</p>
	</div>
</div>

 <script>
	var pageSource=getUrlParams("tel").tel
	var pageId="messageAnnualBonus"
	$(function(){
		cmwaOnkeyup("userName;mobilePhone",checkAppoInfoParam);
		elemBind();
	 	operatingRecord(pageSource,"openMessagePage",pageId,"","","","")
	});
	/* 验证输入框的有效性  */
	function checkAppoInfoParam(){
		var userName = $("#userName").val();
		var mobilePhone = $("#mobilePhone").val();
		if(userName == null || userName == ""){
			$("#saveBtn").addClass("disabled").attr("onclick","");
			return;
		}else if(mobilePhone == null || mobilePhone == ""){
			$("#saveBtn").addClass("disabled").attr("onclick","");
			return;
		}else{
			$("#saveBtn").removeClass("disabled").attr("onclick","saveAppointInfo()");
		}
	}
    /*
     * 预约提交
     */
	function seeProduct() {
        bussiness();
    }
	
	/*
	 * 用户信息提交
	 */
	function userDateSumbit(userName,mobilePhone){
		$.ajax({
				async : false,
				url:apiHost + "/api/insertAppointInfo",
				type : "post",
				dataType : 'json',
				data : {
					"userName":userName,
					"mobilePhone":mobilePhone,
					"productType":"AnnualBonusAll",
					"cmfUserId":""
				},
				success : function(data) {
					if(data.success){
						$(".reserves").addClass("hide")
						$(".success").removeClass("hide")
						$("input[name=userName]").val('');
						$("input[name=mobilePhone]").val('');
						$("#saveBtn").addClass("disabled").attr("onclick","");
					   operatingRecord(pageSource,"makeMessageSuccess",pageId,"","","","")
					}else{
						errorRemark(data.msg);
					}
				},
				error : function() {
					errorRemark("网络繁忙，请稍后再试。");
				},
			});
	}
	/**
	 * 元素事件绑定
	 */
	function elemBind(){
	    //鼠标键盘弹起
		$("input").keyup(function(){
			if($("input[name=userName]").val()!==""&&$("input[name=mobilePhone]").val()!==""){
				$("button").removeClass("disabled");
			}
		});
	     //输入框光标事件
		$("input").focus(function(){
			$(this).parents("div").addClass("foucs");
			$(this).parents("li").find("p").hide().text("")
		});
		$("input").blur(function(){
			$(this).parents("div").removeClass("foucs");
		});
	
		//弹窗关闭
		$(".close").click(function(){
			$(".cover-bg").addClass("hide");
			$("input[name=userName]").val('');
			$("input[name=mobilePhone]").val('');
	        $(".reserves li p").hide();
	        $("body,html").css({"overflow":"auto","height":"auto"}); 
	        $("#saveBtn").addClass("disabled").attr("onclick","");
		})
	
	}
	
	//点击信息提交
	function saveAppointInfo(){
			var userName=$.trim($("input[name=userName]").val());
			var mobilePhone=$.trim($("input[name=mobilePhone]").val());
			var flag=true;
			if(userName==""||!ischinese(userName)){
				$("input[name=userName]").parents("li").find("p").show().text("请输入2-10字中文姓名");
				flag=false;
			}	
			if (!isMobile(mobilePhone)) {
				$("input[name=mobilePhone]").parents("li").find("p").show().text("请输入正确的手机号码");
				flag=false;
			}
			
			if(flag){
				userDateSumbit(userName,mobilePhone);
			}
	}
	
	
	function ischinese(name){
	    return /^[\u2E80-\u9FFF]{2,10}$/.test(name)
	}  
	
	 //验证手机号
	function  isMobile(phone) {
	        return /^0?(13[0-9]|15[0123456789]|18[0123456789]|14[0123456789]|17[0123456789])[0-9]{8}$/.test(phone);
	}
	/**
	 * 预约
	 */
	function bussiness(){	
		 operatingRecord(pageSource,"clickAppointment",pageId,"","","","")
		 $(".reserves").removeClass("hide");
		 $("body,html").css({"overflow":"auto","height":"100%"}); 
	}
    function myAdviser(){
        location.href = "/WeixinService/sendMessage/annualBonus/bussinessCard.html?pageSource=" + pageSource + "&eventId=event_AnnualBonus_adviserId"
    }
 </script>
</body>
</html>
