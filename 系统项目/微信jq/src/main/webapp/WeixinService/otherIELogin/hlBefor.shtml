<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>债市精选*和利系列</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
	<link rel="stylesheet" href="/WeixinWeb/WeixinWeb_Css/public.css">
	<link rel="stylesheet" href="/WeixinWeb/WeixinWeb_Css/style.css">
	<script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/jquery-init.min.js"></script>
	<script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/commons.js"></script>
		<script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/freedom.js"></script>
    <script type="text/javascript" src="/WeixinWeb/WeixinWeb_JSLibrary/flexible.min.js"></script>
    <script type="text/javascript">
    var eventId = '',pageId = '',pageSource = '';
    $(function(){
    	//预热图文，回复图文
    	var urlParams = getUrlParams();
    	eventId = urlParams['eventId']?urlParams['eventId']:eventId;
    	pageSource = urlParams['pageSource']?urlParams['pageSource']:pageSource;
    	pageId = urlParams['pageId']?urlParams['pageId']:pageId;
    	//记录点击
    	recordOperation({eventId:eventId,pageId:pageId,pageSource:pageSource});
 	
     });
     
    function goToLogin(){
    	var isLogin = checkIsLogin();
    	if(isLogin){
        	if(pageSource && pageSource == 'wx_model_textProRepotId'){
            	//季报
        		redirectUrl('/WeixinService/business/query/msgList.shtml?pageSource='+pageSource+'&pageId='+pageId+'&eventId='+eventId);
            }else{
	        	//convert
	        	redirectUrl('/WeixinService/business/query/convert.shtml?pageSource='+pageSource+'&pageId='+pageId+'&eventId='+eventId);
            }
        }else{
        	 var url = "/WeixinService/otherIELogin/otherIELogin.shtml?pageSource="+pageSource;
		     var u = navigator.userAgent.toLowerCase();  
		     if(u.match(/MicroMessenger/i)=="micromessenger"){  /* 微信端 */
		        	var url = "/WeixinService/weixinLogin/login.shtml?pageSource="+pageSource;
		     }
		     redirectUrl(url);
        }
    }
    
    function redirectUrl(url) {
    	window.location.href = url;
    }

    
    </script>
</head>
<body>
     <div class="bg" style="display: block;">
     	<a href="javascript:void(0);" onclick="goToLogin()" class="btn">查看产品详情</a>
     </div>
     <style>
     	html{
     		height: 100%;
     	}
     	.bg{
     		width: 100%;
     		height: 100%;
     		background: url(/WeixinWeb/WeixinWeb_Images/activity/heli/heli02.jpg);
     		background-size: 100% 100%;
     	}
     	.btn{
     		display: block;
     		position: absolute;
     		bottom: .5rem;
     	    left: 50%;
     	    margin-left:-3.12rem;
     		width: 6.24rem;
     		height: .9rem;
     		line-height: .85rem;
     		background:url(/WeixinWeb/WeixinWeb_Images/activity/heli/helibtn.png);
     		background-size: 100% 100%;
     		font-size: .36rem;
     		text-align: center;
     		color: #8e0a00;
     		font-weight: bold;
     	}
     </style>
     
</body>
</html>
