<body>
	<div class="warpper">
		<div class="banner"></div>
		<div class="purchase">
			<div class="purchase-but but-start once once1" >立即购买</div>
			<div class="purchase-but but-over"  onclick="bussiness();" id="myBtn1" style="display: none;">立即预约</div>
		</div>
		<div class="be-thankful">
			<div class="link-box">
				<div class="go-register">
					<div class="register-start antel"></div>
					<div class="register-over antel"  style="display: none;"></div>
				</div>
				<div class="go-share">
					<div class="share-start antel"></div>
					<div class="shart-over antel" style="display: none;"></div>
				</div>
			</div>
		</div>
		<div class="character"></div>
		<div class="base-box">
			<div class="box-img"><img src="/WeixinWeb/WeixinWeb_Images/H5modules/fatherDay/fqj02_07.png" width="100%"></div>
		</div>

	</div>

	<!--预约信息填写-->
	<div class="cover-bg reserves hide">
		<div class="content">
			 <span class="close"></span>
			 <h1>一键预约享专属服务<br>让投资无后顾之忧</h1>
			 <h3>我们的专属顾问将24小时内给您回电</h3>
			 <div class="form">
			 	<ul>
				 	<li>
				 	   <div class="inputBox">
				 	  	   <span></span> <input type="text" id="userName" name="userName" placeholder="请输入姓名"/>
				 	   </div>	
				       <p style="display: none;"></p>
				 	</li>
				 	<li class="foucs">
				 		<div class="inputBox">
				 	        <span></span> <input type="tel" id="mobilePhone" name="mobilePhone" maxlength="11" placeholder="请输入手机号码"/> 
				 		</div>
				 		<p  style="display: none;"></p>
				 	</li>
				 	
				 </ul>
				 <button id="saveBtn"  class="disabled">立即提交</button>
			 </div>
		</div>
	</div>
	<!-- 错误提示 -->
	<div id="errorDiv" class="cover-opacity hide" onclick="errorRemarkHide();">
		<span id="errorRemark"></span>
	</div>
	<!--预约成功-->
	<div class="cover-bg success hide">
		 <div class="content center">
		 	<span class="close"></span>
		 	<div class="successIcon"></div>
		 	<h2>预约成功</h2>
		 	<p>客户经理将尽快与您联系，请保持电话畅通</p>
		 </div>
	</div>
	 <!-- 尚未完成操作弹窗-->
    <div class="cover_bg" id="noOperation" style="display: none;">
    	 <!-- 尚未完成风险评测-->
    	 <div class="content risk" id="riskContent" style="display: none;">
    	 	  <h2></h2>
    	 	  <p>哎呀！您尚未完成风险测评</p>
    	 	  <div class="tips">
    	 	  	  <h3>温馨提示：</h3>
    	 	  	  <p>根据监管要求，为保护投资者权益，需要了解您的相关信息和风险等级，以实现对您的最大保障。</p>
    	 	  	  <p class="yearReport">
    	 	  	  	 动动小指尖， 30秒完成风险测评，轻松查看产品信息
    	 	  	  </p>
    	 	  </div>
    	 	 <a href="javascript:void(0);" id="goRisk" class="btn">我要测评</a>
    	 </div>
    	 <!-- 重新测评-->
    	 <div class="content rNameRisk" id="reRiskContent"  style="display: none;">
    	 	  <h2></h2>
    	 	  <p>根据监管要求，您的风险测评已过有效期，还请重新测评</p>
    	 	   <a href="javascript:void(0);" id="reRisk" class="btn">确定</a>
    	 </div>
	</div>
	<!---活动已结束--->
	<div class="cover-bg hide" id="overActivity">
		<div class="bg-img center" style="border-radius: 5px;">
			<div class="bj-box">
				<div class="shut-down"></div>
				<img src="/WeixinWeb/WeixinWeb_Images/H5modules/fatherDay/fqjtshik_03.png" width="100%">
			</div>
		</div>
    	
	</div>
	<!---微信分享--->
	<div id="mask" class="mask" style="display: none">
    	<div class="share"></div>
    	<p style="line-height: 25px;">点击右上角分享<br> 财富人生敬父爱<br> 茅台酒香献礼来！</p>
	</div>
