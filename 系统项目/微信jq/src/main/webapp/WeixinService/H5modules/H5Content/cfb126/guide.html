<body>
<div class="guide">
    <div class="guide1">
        <p></p>
        <p>历史业绩优良，产品期限短，<br>定期开放，进退灵活，旗舰<br>配置，权威团队，稳步求赢！</p>
    </div>
    <div class="guide2">
        <h1></h1>
        <div class="product">
            <h2>财富宝126天理财系列</h2>
            <!--<h3>募集截止：2018年6月27日 15:00</h3>-->
            <ul class="clearFloat">
                <li>
                    <p><span>126</span>天</p>
                    <p>产品期限</p>
                </li>
                <li style="padding-top: .05rem;">
                    <p><span>登录可见</span></p>
                    <p>业绩报酬计提基准</p>
                </li>
                <li>
                    <p><em id="startBuy"></em><span>万</span></p>
                    <p>起投金额</p>
                </li>
            </ul>
            <a href="javascript:;" class="loginSee" onclick="seeProduct()">登录可见产品详情</a>
            <p class="t1">产品风险等级为R2，适合C2中低风险承受能力以及以上客群。</p>

        </div>
    </div>
</div>
<div class="bottom clearFloat">
    <a href="javascript:;" onclick="bussiness();" id="myBtn1">我感兴趣</a>
    <a href="javascript:;" onclick="myAdviser();" id="myBtn2">我的顾问</a>
</div>

<!--预约信息填写-->
<div class="cover-bg reserves hide">
    <div class="content">
        <span class="close"></span>
        <h1>一键预约享专属服务<br>让投资无后顾之忧</h1>
        <h3>我们的专属顾问将24小时内给您回电</h3>
        <div class="form">
            <ul>
                <li>
                    <div class="inputBox">
                        <span></span> <input type="text" id="userName" name="userName" placeholder="请输入您的姓名"/>
                    </div>
                    <p style="display: none;"></p>
                </li>
                <li class="foucs">
                    <div class="inputBox">
                        <span></span> <input type="tel" id="mobilePhone" name="mobilePhone" maxlength="11"
                                             placeholder="请输入您的手机号码"/>
                    </div>
                    <p style="display: none;"></p>
                </li>

            </ul>
            <button id="saveBtn" class="disabled">立即提交</button>
        </div>
    </div>
</div>
<!-- 错误提示 -->
<div id="errorDiv" class="cover-opacity hide" onclick="errorRemarkHide();">
    <span id="errorRemark"></span>
</div>
<!--预约成功-->
<div class="cover-bg success hide">
    <div class="content center">
        <span class="close"></span>
        <div class="successIcon"></div>
        <h2>预约成功</h2>
        <p>客户经理将尽快与您联系，请保持电话畅通</p>
