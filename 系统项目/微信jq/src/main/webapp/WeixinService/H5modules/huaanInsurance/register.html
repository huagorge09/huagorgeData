	<title>招商财富×华安保险</title>
	<link rel="stylesheet" href="/WeixinWeb/WeixinWeb_Css/H5modules/huaanInsurance/style.css"/>
	<link rel="stylesheet" href="/WeixinWeb/WeixinWeb_Css/H5modules/huaanInsurance/dialog.css"/>

<body>
    <div class="wrap">
    	<div class="banner"></div>
    	<div class="content">
    		<div class="inputBox">
    			 <p>为保证您权益的成功发放，请输入本人真实信息</p>
	    		 <ul class="form">
	    		 	<li class="dswkb">
	    		 		<span>真实姓名</span>
	    		 		<input type="text"  name="userName" placeholder="请输入您的真实姓名" class="flex1" onfocus="this.blur()" readonly="readonly"/>
	    		 	</li>
	    		 	<li class="dswkb">
	    		 		<span>手机号码</span>
	    		 		<input type="tel"  name="telPhone" placeholder="请输入您的手机号码" class="flex1" maxlength="11" />
	    		 	</li>
	    		 	<li class="dswkb">
	    		 		<span>设置密码</span>
	    		 		<input type="password"  name="passWord" placeholder="请设置6-16位数字组成的登录密码" class="flex1">
	    		 	</li>
	    		 	<li class="dswkb">
	    		 		<span>确认密码</span>
	    		 		<input type="password"  name="repassWord" placeholder="请再次输入密码" class="flex1"/>
	    		 	</li>
	    		 	<li class="dswkb">
	    		 		<span>验证码</span>
	    		 		<input type="tel" maxlength="6"  name="captcha" placeholder="请输入验证码" class="flex1" />
	    		 		<i id="getCaptcha">获取验证码</i>
	    		 	</li>
	    		 </ul>
	    		 <div class="check">
	    		 	 <i></i>我已确认  | <em>服务协议</em>
	    		 </div>
	    		 <a href="javascript:void(0)" class="" id="getBtn">领取100元礼品卡</a>
	    	</div>
    	</div>
    	<div class="pinxuan">
    		<img src="/WeixinWeb/WeixinWeb_Images/H5modules/huaanInsurance/pinxuan.png" width="100%"/>
    		<p><a href="https://wx.cmwachina.com/WeixinService/H5modules/H5Content/brandPublicity/index.html">关于我们>></a></p>
    	</div>
    	<p class="tips">如有任何疑问，欢迎致电招商财富咨询：<span>0755-23988886</span>。<br />*活动最终解释权归招商财富所有。</p>
    </div>
