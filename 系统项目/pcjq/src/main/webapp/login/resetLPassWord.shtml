<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>修改登录密码</title>
<link rel="shortcut icon" href="/AppWeb/AppWeb_Css/index/image/favicon.ico" type="image/x-icon"/>
<link rel="icon" href="/AppWeb/AppWeb_Css/index/image/favicon.ico" type="image/x-icon"/>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
</head>
<body>

	<div class="cover_bg" id="cover_bg_01" style="display: none;">
		<div class="cover-phone-identify place-holder-point place-holder-point">
			<h1>手机验证</h1>
			<i class="close" onclick="close_tips('cover_bg_01')"></i>
			<div class="phone-identify registe-con placeholder-phone">
				<span class="identify-point">请获取手机验证码</span>
				<ul>
					<li>
						<label for="phone" class="phone">手机号码</label> 
						<span class="phone-text" id="mobileText"></span>
					</li>
					<li>
						<label for="identify">验证码</label> 
						<input type="text" class="identify-input phone" id="verifyCode" placeholder="短信验证码"> 
						<span class="indentifyimg phone"> 
							<input type="button" onclick="getMsgByPsw()" id="AgetCode" value="点击获取验证码">
						</span>
						<div class="indentifyimg-point" id="sendMsg_tips">
							<span class="point-clickbefore">请输入6位数验证码。</span> 
							<span class="point-clickafter none">验证码已发送至您的手机，请勿泄露。</span>
						</div>
					</li>
				</ul>
				<input class="phone-identify-btn" type="button" onclick="checkMobileCode();" value="下一步">
			</div>
		</div>
	</div>
	<!-- header -->
	<!--#include virtual="/AppService/public/header.shtml"-->


	<div style="display: none;">
		<input type="hidden" id="sessionID" value="" />
	</div>
	
	

	<div class="pay-schedule mid registe-schedule clear">
		<div class="pay-order schedule01 current">
			<span>1、手机验证</span>
		</div>
		<div class="pay-order schedule02">
			<span>2、设置密码</span>
		</div>
		<div class="pay-order schedule03">
			<span>3、设置成功</span>
		</div>
	</div>
	
	<div class="confirm-order registe-mid mid clear place-holder-point" id="div_01">
		<div class="registe-con recoverpassword">
			<ul>
				<li>
					<label for="phone">手机号码</label> 
					<input type="text" id="mobile" class="phone" placeholder="请输入手机号码" value="" readonly="readonly">
					<span class="error-point phone"> 
						<img id="error_tips_01" class="none" src="/AppWeb/AppWeb_Images/images/user_zhaoMiMa_ok.png" height="21px" width="21px"> 
						<i id="error_tips_02" class="error-point-phone none">手机号码有误</i>
					</span>
				</li>
				<li>
					<label for="repassword">验证码</label> 
					<input type="text" id="vrfCode" class="identify-input"> 
					<span class="indentifyimg">
						<img src="/AppService/setUp/buildimageservlet.xhtml" id="rondomCodeImg" onclick="getRandomCode()"  height="42" width="80"/>
					</span> 
					<span class="identify-point">看不清<em onclick="getRandomCode()">换一张</em></span> 
					<span id="error_tips_03" class="error-point identify none">验证码有误</span> 
					<b class="password-point">不区分字母大小写</b>
				</li>
			</ul>
			<span class="registe-con-btn"><a href="javascript:checkVrfCode()">下一步</a></span>
		</div>
	</div>
	
	
	<div class="confirm-order registe-mid place-holder-point recoverpassword mid clear placeholder-top" id="div_02" style="display: none;">    
	    <div class="registe-con">
	        <span class="realname-point">请输入6-16位数字作为登录密码</span>
	        <ul>
	            <li>
	                <label for="password">输入密码</label>
	                <input type="password" id="password" class="password" placeholder="请设置6-16位数字组成的登录密码">
	                <span class="error-point repassword none" id="psw_tips1">密码格式有误</span>
	            </li>
	            <li>
	                <label for="repassword">再次确认</label>
	                <input type="password" id="rePassword" class="repassword" placeholder="请再次输入密码">
	                <span class="error-point repassword none" id="psw_tips2">两次密码不一致</span>
	            </li>            
	        </ul>
	        <span class="registe-con-btn"><a href="javascript:resetLPws()">下一步</a></span>
	    </div>
	</div>
	
	
	<div class="confirm-pay pay-state recoverpassword-succe registe-mid mid clear" id="div_03" style="display: none;">
	    <img class="pay-state-img" src="/AppWeb/AppWeb_Images/images/resizesucc.png" />
	    <h2>恭喜您，重置密码成功！</h2>
	    <span class="nowlogin">马上去登录吧</span>
	    <a href="/login/login.shtml" class="nowlogin">马上登录</a>
	</div>
	
	<!-- footer -->
	<!--#include virtual="/AppService/public/footer.shtml"-->
	<script type="text/javascript" src="/AppWeb/AppWeb_JSLibrary/pageReq.min/resetLPassWord.min.js"></script>
</body>
</html>
