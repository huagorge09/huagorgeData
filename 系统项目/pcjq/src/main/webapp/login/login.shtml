<body onkeydown="keyLogin()">

	<!-- header -->
	<!--#include virtual="/AppService/public/header.shtml"-->
	<input type="hidden" id="pageId" value="loginId" />
	<div class="login-content">
	    <div class="login-content-mid mid">
	    

	        <div id="personal" class="login-panel personal">
	        	<div class="hrefcompany"></div>
	            <div class="panel">
	                <h3>个人客户登录</h3>
	                <div class="panel-input user-name">
	                    <input type="text" id="mobile" placeholder="手机号码/身份证号码">
	                </div>
	                <div class="panel-input user-password">
	                    <input type="password" id="password" placeholder="6位以上数字登录密码" style="width: 190px;">
	                    <a href="/login/resetLPassWord.shtml?type=R" class="recoverpassword">找回密码</a>
	                </div>
	                <div class="panel-input user-identify">
	                    <input type="text" id="vrfCode_1" placeholder="验证码">
	                    <!-- <img src="/AppWeb/AppWeb_Images/images/identify.jpg" alt="" class="identify-text"> -->
						<img src="/AppService/setUp/buildimageservlet.xhtml" id="rondomCodeImg_1" class="identify-text" onclick="getRandomCode()"/>
	                </div>
	                <div class="panel-input remenbername">
	                    <!-- <input type="checkbox" class="checkbox fl" checked="checkbox"> -->
	                    <!-- <span class="remenbername-point fl">记住用户名</span> -->
	                    <a href="/login/register.shtml" class="hrefregiste fr">注册会员</a>
						<input type="checkbox" class="checkbox fl" checked="true" id="agreeCheckbox">
	                    <span class="remenbername-point fl">同意
							<a href="/login/registerRiskScript.shtml" target="_blank">《个人投资者告知函书》</a>
						</span>	
					</div>
                         
	                <div class="panel-btn clear">
	                    <input type="button" value="立即登录" class="button" onclick="login();" id="person" data-event="event_loginId"/>
	                </div>
	            </div>
	        </div>
	        
	        <div id="company" class="login-panel company hidden">
	            <div class="hrefpersonal"></div>
	            <div class="panel">
	                <h3>机构客户查询</h3>
	                <div class="panel-input user-name">
	                    <input type="text" placeholder="营业执照上的企业全称" id="branchName" style="width: 190px;">
	                </div>
	                <div class="panel-input user-code">
	                    <input type="text" id="fundAcco" placeholder="企业或产品基金账号">
	                </div>
	                <div class="panel-input user-registeNo">
	                    <input type="text" id="branchLicense" placeholder="企业营业执照注册号">
	                </div>
	                <div class="panel-input user-identify">
	                    <input type="text" id="vrfCode_2" placeholder="验证码">
			  <img src="/AppService/setUp/buildimageservlet.xhtml" id="rondomCodeImg_2" class="identify-text" onclick="getRandomCode()"/>
	                </div>
	               <div class="panel-input remenbername">
	                    <!-- <input type="checkbox" class="checkbox fl" checked="checkbox"> -->
	                    <!-- <span class="remenbername-point fl">记住用户名</span> -->
	                    <a href="/login/login.shtml?type=abs" class="hrefregiste fr">ABS入口</a>
	                </div>
                         <div class="panel-btn clear">
	                    <input type="button" value="立即登录" onclick="branchUserLogin();" class="button">
	                </div>
	            </div>
	        </div>

			<div  id="abs" class="login-panel company  hidden">
				<div class="hrefpersonal"></div>
				<div class="panel">
					<h3>机构客户查询</h3>
					<div class="panel-input user-name">
						<input type="text" placeholder="营业执照上的企业全称" id="branchNameAbs" style="width: 190px;">
					</div>
					<div class="panel-input user-registeNo">
						<input type="text" id="branchLicenseAbs" placeholder="企业营业执照注册号">
					</div>
					<div class="panel-input user-identify">
						<input type="text" id="vrfCode_2Abs" placeholder="验证码">
						<img src="/AppService/setUp/buildimageservlet.xhtml" id="rondomCodeImg_2" class="identify-text" onclick="getRandomCode()"/>
					</div>
                                             <div class="panel-input remenbername">
	                    <!-- <input type="checkbox" class="checkbox fl" checked="checkbox"> -->
	                    <!-- <span class="remenbername-point fl">记住用户名</span> -->
	                    <a href="/login/login.shtml" class="hrefregiste fr">个人入口</a>
	                </div>
					<div class="panel-btn clear">
						<input type="button" value="立即登录" onclick="branchUserLogin();" class="button" />
					</div>
				</div>
			</div>
	    </div>
	</div>
       <!-- 系统通知弹窗-->

			<a class="btn systemNotice" style="margin-top: 30px;">确定</a>
		</div>
	</div>

                   #company .panel .panel-btn { margin-top: -19px;}

	<script>
		$(function () {
			var now = new Date();
			str =new Date("2018-07-28 00:00:00"),
			str2 = new Date("2018-07-28 08:00:00")
			if(now>=str&&now<=str2) {
				$("#systemOperation").show();

		})
