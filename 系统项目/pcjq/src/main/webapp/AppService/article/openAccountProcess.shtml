    <div class="flow-box box1">
        <h1>1</h1>
        <div class="flow-con">
            <h2>登录或注册成为招商财富客户</h2>
            <span>您需要提供有效的手机号码，并认证为“合格投资者”，即可成为招商财富尊贵客户，享受快捷、方便的理财服务。</span> 
        </div>
        <img src="/AppWeb/AppWeb_Images/images/xiangQing_img1.png" height="318" width="728" alt="" class="flow-img">
    </div>
    <div class="flow-box box1">

            <h2>查看优质产品</h2>

        </div>
        <img src="/AppWeb/AppWeb_Images/images/xiangQing_img2.png" height="318" width="728" alt="" class="flow-img">
    </div>
    <div class="flow-box box1">
        <h1>3</h1>
        <div class="flow-con">
            <h2>购买及支付</h2>
            <span>完成实名认证后，点击产品介绍页面的“立即预约”或者“立即购买”按钮，并按提示进行操作，即可成功购买相应理财产品。</span> 
        </div>
        <img src="/AppWeb/AppWeb_Images/images/xiangQing_img3.png" height="318" width="728" alt="" class="flow-img">
    </div>
    <div class="flow-box box1">
        <h1>4</h1>
        <div class="flow-con">
            <h2>订单查询</h2>
            <span>付款成功后，您可以在“我的财富”中查询相关订单信息，时时刻刻掌握您的理财信息。</span> 
        </div>
        <img src="/AppWeb/AppWeb_Images/images/xiangQing_img4.png" height="318" width="728" alt="" class="flow-img">
