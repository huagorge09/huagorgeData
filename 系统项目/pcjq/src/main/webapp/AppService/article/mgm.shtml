<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="x5-orientation" content="portrait" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="format-detection" content="telephone=no">
    <script type="text/javascript" src="/AppWeb/AppWeb_JSLibrary/pageJs/jquery.js"></script>
    <script type="text/javascript" src="/AppWeb/AppWeb_JSLibrary/dropload.min.js"></script>
    <title>mgm</title>
    <style>
    	* {
    		margin: 0;
    		padding: 0;
    		-webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    		-webkit-appearance: none;
    		outline: none;
    		word-break: break-all;
    		box-sizing: border-box;
    		-webkit-box-sizing: border-box;
    	}
    	
    	*:not(input, textarea) {
    		-webkit-touch-callout: none;
    		-webkit-user-select: none;
    	}
    	
    	html,
    	body {
    		color: #333;
    		margin: 0 auto;
    		font-family: Arial, "Microsoft YaHei";
    		background: #fff;
    		height: 100%;
    		font-size: 50px
    	}
    	
    	input {
    		-webkit-user-select: initial;
    		font-family: Arial, "Microsoft YaHei";
    		border: none;
    	}
    	
    	i {
    		font-style: normal
    	}
    	
    	a {
    		text-decoration: none;
    		color: #ffffdd;
    	}
    	
    	a:link {
    		text-decoration: none;
    	}
    	
    	a:visited {
    		text-decoration: none;
    	}
    	
    	a:hover {
    		text-decoration: none;
    	}
    	
    	a:active {
    		text-decoration: none;
    	}
    	
    	em {
    		font-style: normal
    	}
    	
    	ul,
    	ol,
    	li {
    		list-style: none;
    	}
    	
    	h1,
    	h2,
    	h3,
    	h4,
    	h5,
    	h6 {
    		font-weight: normal;
    	}
    	
    	img {
    		border: 0;
    	}
    	
    	.fl {
    		float: left;
    	}
    	
    	.fr {
    		float: right;
    	}
    	
    	em {
    		font-size: .36rem;
    		color: #3f3f3f;
    		display: inline-block;
    		width: 4.3rem;
    		overflow: hidden;
    		text-overflow: ellipsis;
    		white-space: nowrap;
    		padding-top: .1rem;
    	}
    	
    	ul li {
    		border-bottom: 1px #ebebeb solid;
    		position: relative;
    		padding: 0 .2rem 0 .2rem;
    	}
    	
    	ul li span {
    		color: #949393;
    		font-size: .18rem;
    	}
    	
    	ul li img {
    		width: .5rem;
    		height: .5rem;
    	}
    	
    	ul li a {
		    position: absolute;
		    right: .25rem;
		    top: .35rem;
		    display: block;
		    width: .5rem;
		    height: .5rem;
		    z-index: 888;
    	}
    	
    	ul li .title {
    		margin-bottom: .03rem;
    	}
    	
    	ul li i {
    		margin-left: .3rem;
    		font-size: .3rem;
    		position: absolute;
    		top: 0.15rem;
    	}
    	
    	.title {
    		height: .8rem;
            line-height: .88rem;
    	}
    	
    	.brief {
		    height: .2rem;
		    line-height: .2rem;
		    font-size: .34rem;
		    color: #999;
    	}
    	
    	.brief>div {
    		overflow: hidden;
    		text-overflow: ellipsis;
    		white-space: nowrap;
    		width: 6.4rem;
    	}
    	
    	.dropload-up,
    	.dropload-down {
    		position: relative;
    		height: 0;
    		overflow: hidden;
    		font-size: 12px;
    		/* 开启硬件加速 */
    		-webkit-transform: translateZ(0);
    		transform: translateZ(0);
    	}
    	
    	.dropload-down {
    		height: 50px;
    	}
    	
    	.dropload-refresh,
    	.dropload-update,
    	.dropload-load,
    	.dropload-noData {
    		height: 50px;
    		line-height: 50px;
    		text-align: center;
    		font-size: 16px;
    	}
    	
    	.dropload-load .loading {
    		display: inline-block;
    		height: 18px;
    		width: 18px;
    		border-radius: 100%;
    		margin: 6px;
    		border: 2px solid #666;
    		border-bottom-color: transparent;
    		vertical-align: middle;
    		-webkit-animation: rotate 0.75s linear infinite;
    		animation: rotate 0.75s linear infinite;
    	}
    	
    	@-webkit-keyframes rotate {
    		0% {
    			-webkit-transform: rotate(0deg);
    		}
    		50% {
    			-webkit-transform: rotate(180deg);
    		}
    		100% {
    			-webkit-transform: rotate(360deg);
    		}
    	}
    	
    	@keyframes rotate {
    		0% {
    			transform: rotate(0deg);
    		}
    		50% {
    			transform: rotate(180deg);
    		}
    		100% {
    			transform: rotate(360deg);
    		}
    	}
    </style>
</head>
<body> 	
	<script>
		(function (doc, win) {
		    var docEl = doc.documentElement,
		        resizeEvt = 'orientationchange' in window ? 'orientationchange' : 'resize',
		        recalc = function () {
		            var clientWidth = docEl.clientWidth;
		            if (!clientWidth) return;
		            docEl.style.fontSize = 100 * (clientWidth / 750) + 'px';
		        };
		    if (!doc.addEventListener) return;
		    win.addEventListener(resizeEvt, recalc, false);
		    doc.addEventListener('DOMContentLoaded', recalc, false);
		})(document, window);
	</script>

	<div class="wrap">
		<ul>
		
		</ul>
		
	</div>
</style>
<script>
$(function(){
    // 页数
    var page = 0;
    // dropload
    $('.wrap').dropload({
        scrollArea : window,
         domDown : {
            domClass   : 'dropload-down',
            domRefresh : '<div class="dropload-refresh"></div>',
            domLoad    : '<div class="dropload-load"><span class="loading"></span>数据加载中...</div>',
            domNoData  : '<div class="dropload-noData">暂无数据</div>'
        },
              loadDownFn : function(me){
            page++;
            // 拼接HTML
            var result = '';
            $.ajax({
                type: 'GET',
                url: '/AppService/article/queryMgmArticle.xhtml?page='+page+"&catalog_id=2952",
                dataType: 'json',
                success: function(data){
                	if(data.returnCode=="0000"){
	                    var arrLen = data.list.length;
	                    if(arrLen > 0){
	                        for(var i=0; i<arrLen; i++){
	                        	var publishDate="";
	                        	if(data.list[i].publishDate.length>10){
	                        		publishDate=data.list[i].publishDate.substring(0,10)
	                        	}else{
	                        		publishDate=data.list[i].publishDate
	                        	}
	                           result +='<li>'+
		                                    '<div class="title">'+
												'<em>'+data.list[i].title+'</em>'+
												'<i>'+publishDate+'</i>'+
											'</div>'+
										   '<div class="brief">'+
											   
												'<a href='+data.list[i].linkUrl+' target="_blank">'+
												   '<img src="/AppWeb/AppWeb_Images/images/download_center_bt.png">'+
												'</a>'+
										   '</div>' +
	                                     '</li>'
	                        }
	                    // 如果没有数据
	                    }else{
	                        // 锁定
	                        me.lock();
	                        // 无数据
	                        me.noData();
	                    }
	                    // 为了测试，延迟1秒加载
	                    setTimeout(function(){
	                        // 插入数据到页面，放到最后面
	                        $('ul').append(result);
	                        // 每次数据插入，必须重置
	                        me.resetload();
	                    },500);
                    }
                },
                error: function(xhr, type){
                	 alert("系统出错啦")
                    // 即使加载出错，也得重置
                    me.resetload();
                }
                
            });
        },
        threshold : 50
    });
});
</script>

</body>
</html>
