<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>设置安全码</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
</head>
<body>
	<!-- header -->
	<!--#include virtual="/AppService/public/header.shtml"-->
	
<div style="display: none;">
	<input type="hidden" id="sessionID" value="" />
</div>
	
<div class="pay-schedule mid registe-schedule clear">
    <div class="pay-order schedule01 current"><span>1、验证身份</span></div>
    <div class="pay-order schedule02"><span>2、设置安全码</span></div>
    <div class="pay-order schedule03"><span>3、设置成功</span></div>
</div>


<div class="confirm-order place-holder-point registe-mid recoverpassword updatepaypassword mid clear" id="div_01">    
    <div class="registe-con">
        <span class="realname-point">为了保障您的账户安全，请先进行手机验证</span>
        <div class="indentify-phone">
            <span class="fl">您绑定的手机号码为<em id="mobile"></em></span>
            <input type="button" value="获取验证码" id="AgetCode" onclick="sendMsg();">
        </div>
        <ul>
            <li>
                <label for="indentifyimg">输入验证码</label>
                <input type="text" class="indentifyimg" placeholder="请输入验证码" id="vrfCode">
                <span class="error-point indentify none" id="error_tips_01">短信验证码有误</span>
            </li>   
            <div class="indentifyimg-point sendMsg_tips" id="sendMsg_tips" style="display: none;">
				<span class="point-clickafter none" id="point-clickafter" style="display: inline;">验证码已发送至您的手机，请勿泄露；</span>
			</div>                   
        </ul>
        <span class="registe-con-btn">
        	<a href="javascript:checkVrfCode();">确认</a>
        	<a href="javascript:history.go(-1);" class="cancel">取消</a>
        </span>
    </div>
</div>


<div class="confirm-order registe-mid place-holder-point mid clear place-holder-point-validate" id="div_02" style="display: none;">
	<div class="registe-con">
		<span class="realname-point">请设置8位以上数字+字母组成的安全码。</span>
		<ul>
			<li><label for="password">设置安全码</label> <input type="password" class="password" placeholder="请设置安全码" id="Tpassword" name="Tpassword"> <span class="error-point repassword none">密码格式不正确</span>
			</li>
			<li><label for="repassword">确认安全码</label> <input type="password" class="repassword" placeholder="请再次输入安全码" id="rTpassword" name="rTpassword"> <span class="error-point repassword none">两次密码不一致</span>
			</li>
		</ul>
		<span class="registe-con-btn"><a href="javascript:setPassword()">完成设置</a></span>
	</div>
</div>


<div class="confirm-pay pay-state registe-mid mid clear" id="div_03" style="display: none;">
	<img class="pay-state-img" src="/AppWeb/AppWeb_Images/images/updatepaypassword.png" />
	<h2>设置成功</h2>
	<span class="state-con con01">恭喜您，<em id="successName"></em>。您已成为招商财富尊贵用户。
	</span> <span class="state-con con02">立即开启财富人生吧！查看<a href="/AppService/business/fund/fundList.shtml" class="state-con02-a">产品超市</a></span>
</div>


<!-- footer -->
<!--#include virtual="/AppService/public/footer.shtml"-->
<script type="text/javascript" src="/AppWeb/AppWeb_JSLibrary/pageReq.min/setTPassword.min.js"></script>
</body>
</html>
