<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title></title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
<link rel="stylesheet" href="/AppWeb/AppWeb_Css/jquery.mCustomScrollbar.css">
</head>
<body>
<!-- header -->
<!--#include virtual="/AppService/public/header.shtml"-->
<div class="pay-schedule mid registe-schedule clear">
    <div class="pay-order schedule01 current"><span>1、身份验证</span></div>
    <div class="pay-order schedule02"><span>2、重置安全码</span></div>
    <div class="pay-order schedule03"><span>3、完成</span></div>
</div>
<div class="confirm-order registe-mid updatepaypassword mid clear" id="div1">    
    <div class="registe-con">
        <ul>
            <li>
                <label for="phone">银行卡号</label>
                <div class="select-cover">
					<span class="select-value" id="selectBank"></span>
					<div class="select-text none">
						<div class="select-text-list">
						</div>
					</div>
				</div> 
				<span class="forgetpassword clear">请选择银行卡</span>
            </li>
            <li class="newpassword">
                <label for="realname">真实姓名</label>
                <input type="text" class="realname" id="userName" readonly="readonly">
            </li>
            <li>
                <label for="identify">证件号码</label>
                <input id="idNo" type="text" class="identify" readonly="readonly" >
            </li>  
        </ul>
        <span class="registe-con-btn"><a href="javascript:toNext()" class="updatepaypassword-btn">下一步</a></span>
    </div>
</div>
<div class="confirm-order place-holder-point registe-mid updatepaypassword mid clear none placeholder-top" id="div2">    
    <div class="registe-con">
        <ul>
            <li>
                <label for="name">银行卡号</label>
                <div class="updatepaypassword-bank">
                    <img src="/AppWeb/AppWeb_Images/images/icon_bank.png" height="17" width="17" alt="" class="incon-banks">
                    <span class="banksNo" id="formatedBankNum"></span>
                </div>
            </li>
            <li>
                <label for="phone">手机号</label>
                <input type="text" id="mobile" class="phone" placeholder="请输入银行卡绑定手机号">
                <span class="error-point phone none">手机号码有误</span>
            </li>
            <li>
                <label for="repassword">验证码</label>
                <input type="text" id="verifyCode" class="identify-input phone-bank" placeholder="请输入6位数验证码">
                <span class="indentifyimg phone">
                    <input type="button" id="AgetCode" onclick="getMobileVerifyCode()" value="点击获取验证码">
                </span>
                <span class="error-point phone none">短信验证码有误</span>
                <div class="indentifyimg-point">
					<span class="point-clickafter none" id="point-clickafter">验证码已发送至您的手机，请勿泄露；</span>
				</div>
                <input type="hidden" id="sessionID"/>
			    <input type="hidden" id="bankNumber"/>
			    <input type="hidden" id="bankName"/>
			    <input type="hidden" id="userNameAll"/>
			    <input type="hidden" id="idNoAll"/>
            </li>
        </ul>
        <span class="registe-con-btn"><a href="javascript:checkVrfCode()">下一步</a><a href="javascript:toUp()" class="cancel">上一步</a></span>
    </div>
</div>
<div class="confirm-order registe-mid place-holder-point updatepaypassword recoverpaypassword mid clear none placeholder-top" id="div3">    
    <div class="registe-con">
        <span class="realname-point">密码为8至16个字符组成，为了您的账号安全，建议密码采用字母和数字混合。</span>
        <ul>
            <li>
                <label for="phone">输入密码</label>
                <input type="password" class="phone" id="txtPassword" placeholder="请设置新的安全码">
                <span class="error-point phone none">请输入您新的密码</span>
            </li>
            <li class="newpassword">
                <label for="password">确认密码</label>
                <input id="txtConfirmPassword" type="password" class="password" placeholder="请再次输入新的安全码">
                <span class="error-point password none">两次密码不一致</span>
            </li>
        </ul>
        <span class="registe-con-btn"><a href="javascript:setPassword()" onclick="">确认</a><a href="javascript:history.go(-1);" class="cancel">取消</a></span>
    </div>
</div>
<div class="confirm-pay pay-state recoverpassword-succe registe-mid mid clear none" id="div4">
    <img class="pay-state-img" src="/AppWeb/AppWeb_Images/images/updatepaypassword.png" />
    <h2>恭喜您，安全码已经重置完成！</h2>
    <span class="nowlogin">
    	<em id="timer1">15</em>秒 后将自动跳转至
    	<a href="/AppService/applicationGroups.shtml?mainCatId=MY_ACCOUNT&thirdCatId=ACCOUNT_INFO">个人信息页</a> >>
    </span>
    <a href="/AppService/applicationGroups.shtml?mainCatId=MY_ACCOUNT&thirdCatId=ACCOUNT_INFO" class="nowlogin">确认</a>
</div>
<!-- footer -->
<!--#include virtual="/AppService/public/footer.shtml"-->
<script type="text/javascript" src="/AppWeb/AppWeb_JSLibrary/pageReq.min/resetTPassword.min.js"></script>
<script src="/AppWeb/AppWeb_JSLibrary/jquery-ui.min.js"></script>    
<script src="/AppWeb/AppWeb_JSLibrary/jquery.mousewheel.min.js"></script>     
<script src="/AppWeb/AppWeb_JSLibrary/jquery.mCustomScrollbar.min.js"></script>
</body>
</html>
