<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>修改安全码</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
</head>
<body>
	<!-- header -->
	<!--#include virtual="/AppService/public/header.shtml"-->
	
<div style="display: none;">
	<input type="hidden" id="sessionID" value="" />
</div>
	
<div class="pay-schedule mid registe-schedule clear">
    <div class="pay-order schedule01 current"><span>1、获取验证码</span></div>
    <div class="pay-order schedule02"><span>2、修改安全码</span></div>
    <div class="pay-order schedule03"><span>3、修改成功</span></div>
</div>


<div class="confirm-order place-holder-point registe-mid recoverpassword updatepaypassword mid clear" id="div_01">    
    <div class="registe-con">
        <span class="realname-point">为了保障您的账户安全，请先进行手机验证</span>
        <div class="indentify-phone">
            <span class="fl">您绑定的手机号码为<em id="mobile"></em></span>
            <input type="button" value="获取验证码" id="AgetCode" onclick="sendMsg();">
        </div>
        <ul>
            <li>
                <label for="indentifyimg">输入验证码</label>
                <input type="text" class="indentifyimg" placeholder="请输入验证码" id="vrfCode">
                <span class="error-point indentify none" id="error_tips_01">短信验证码有误</span>
            </li>  
            <div class="indentifyimg-point sendMsg_tips" id="sendMsg_tips" style="display: none;">
				<span class="point-clickafter none" id="point-clickafter" style="display: inline;">验证码已发送至您的手机，请勿泄露；</span>
			</div>                  
        </ul>
        <span class="registe-con-btn">
        	<a href="javascript:checkVrfCode();">确认</a>
        	<a href="javascript:history.go(-1);" class="cancel">取消</a>
        </span>
    </div>
</div>


<div class="confirm-order place-holder-point registe-mid updatepaypassword mid clear placeholder-top" id="div_02" style="display: none;">    
    <div class="registe-con">
        <span class="realname-point">请输入当前的安全码，并设置新的安全码。</span>
        <ul>
            <li>
                <label for="phone">当前密码</label>
                <input type="password" class="phone" id="tPassword" placeholder="请输入当前的安全码">
                <span class="error-point phone none" id="error_tips_02">请输入您当前的密码</span>
                <a href="/AppService/business/account/resetTPassword.shtml" class="forgetpassword clear" style="width: 200px;">忘记密码？</a>
            </li>
            <li class="newpassword">
                <label for="password">新密码</label>
                <input type="password" class="password" id="newTPassword" placeholder="请设置新的安全码">
                <span class="error-point password none" id="error_tips_03">设置6-8位数字新密码</span>
            </li>
            <li>
                <label for="repassword">确认新密码</label>
                <input type="password" class="repassword" id="reNewTPassword" placeholder="请再次输入新的安全码">
                <span class="error-point repassword none" id="error_tips_04">两次密码不一致</span>
            </li> 
        </ul>
        <span class="registe-con-btn">
        	<a href="javascript:modifyTPassword();">确认</a>
        	<a href="javascript:history.go(-1);" class="cancel">返回</a>
        </span>
    </div>
</div>


<div class="confirm-pay pay-state recoverpassword-succe registe-mid mid clear" id="div_03" style="display: none;">
    <img class="pay-state-img" src="/AppWeb/AppWeb_Images/images/updatepaypassword.png" />
    <h2>恭喜您，安全码已经修改完成</h2>
    <span class="nowlogin"><em id="timer1">15</em>秒 后将自动跳转至<a href="/AppService/applicationGroups.shtml?mainCatId=MY_ACCOUNT&thirdCatId=ACCOUNT_INFO">个人信息页</a> >></span>
    <a href="/AppService/applicationGroups.shtml?mainCatId=MY_ACCOUNT&thirdCatId=ACCOUNT_INFO" class="nowlogin">确认</a>
</div>


<!-- footer -->
<!--#include virtual="/AppService/public/footer.shtml"-->
	<script type="text/javascript" src="/AppWeb/AppWeb_JSLibrary/pageReq.min/modifyTPassword.min.js"></script>
</body>
</html>
