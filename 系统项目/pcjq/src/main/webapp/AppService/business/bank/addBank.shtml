            <li>

                <span class="indentifyimg phone">
                    <input type="button" value="获取验证码" id="getVerifyCodeByBankCard" onclick="getMobileVerifyCode()">
                </span>
                <span class="error-point phone none">短信验证码有误</span>
                <div class="indentifyimg-point">
					<span class="point-clickafter none" id="point-clickafter">验证码已发送至您的手机，请勿泄露；</span>
				</div>
            </li>
        </ul>
        <span class="registe-con-btn"><a href="javascript:void(0);" onclick="checkVrfCode()">完成</a></span>
    </div>
</div>

</div>
