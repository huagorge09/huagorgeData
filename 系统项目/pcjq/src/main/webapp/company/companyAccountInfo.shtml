<div class="cover_bg none" id="updateOrderMoneyDiv" style="z-index: 87;">
    <div class="main-con updateapmoney placeholder-updatepaymoney">
        <i class="close"></i>
        <h2>修改订单金额</h2>
        <ul>
            <li><input type="text" id="newMoney"> <i>元</i></li>
            <li><input class="password" id="tPassWordOrder" type="password" placeholder="安全码"> <a
                    href="/AppService/business/account/resetTPassword.shtml" class="backpassword">找回密码</a></li>
            <li class="identify"><input class="identify-input updatepaybankpassword" id="randomCode1" type="text"

                    src="/AppService/setUp/buildimageservlet.xhtml" id="rondomCodeImg1" onclick="getRandomCode1()"
                    height="42" width="80"/></span></li>
        </ul>
			<span class="btn"> <a href="javascript:modifyAppointRequestMoney();" class="fl">确认修改</a> <a
                    href="javascript:closeUpdateMoney();" class="fr">放弃修改</a>
			</span>
    </div>
</div>
<div class="cover_bg none" id="updateOrderBankCardDiv" style="z-index: 87;">
    <div class="main-con updateapmoney updateapbank placeholder-updateapmoney placeholder-updatepaybank">
        <i class="close"></i>
        <h2>修改支付银行卡</h2>
        <div class="select-cover">
            <span class="select-value" data-bankNm="" data-bankNo="" data-bankAccoDisplay="" data-tradeAcco=""></span>
            <div class="select-text none">
                <div class="select-text-list">
                </div>
            </div>
        </div>
        <ul>
            <li><input class="password" id="tPassWordBank" type="password" placeholder="安全码"> <a
                    href="/AppService/business/account/resetTPassword.shtml" class="backpassword">找回密码</a></li>
            <li class="identify"><input class="identify-input identify-input-update-new" type="text" id="randomCode"

                    height="42" width="80"/></span></li>
        </ul>
			<span class="btn"> <a href="javascript:modifyAppointRequestBankCard();" class="fl">确认修改</a> <a
                    href="javascript:closeUpdateOrderBankCard();" class="fr">放弃修改</a>
			</span>
    </div>
</div>
