<!DOCTYPE html>

<head>

    <title>提前完成月目标</title>
    <script type="text/javascript" src="js/lib/flexible.js"></script>
    <link type="text/css" rel="stylesheet" href="css/public.css"/>
    <link type="text/css" rel="stylesheet" href="css/dash.css"/>

    <style type="text/css">
        .target-balloon{
            bottom: auto;
            display: block;
        }
    </style>
    <script type="text/javascript">
        setTimeout(function(){
            document.querySelector(".target-balloon").setAttribute("class","target-balloon break");
        },1000);
    </script>

<body>
    <!--小猪展示区域-->
    <section id="room">
        <div id="target">
            <!--提前月目标-->
            <div class="target-balloon">
                <div class="balloon"></div>
                <i class="info"></i>
                <div class="target-content">
                    700=1000<i>元</i><br />
                    <p class="date">15岁第10个月</p>
                    <p class="content">
                        在大宝3岁时存入700元相当于在大宝第15岁第3个月存入1000元，可将教育金总目标完成时间提前至第15岁第3个月。
                    </p>
                </div>



                <div class="boom boom1"></div>
                <div class="boom boom2"></div>
                <div class="boom boom3"></div>
                <div class="boom boom4"></div>
                <div class="boom boom5"></div>
                <div class="boom boom6"></div>

                <div class="star star1"></div>
                <div class="star star2"></div>
                <div class="star star3"></div>
                <div class="star star4"></div>
                <div class="star star5"></div>
                <div class="star star6"></div>
            </div>
        </div>
    </section>
</body>
