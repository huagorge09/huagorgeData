<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title></title>
		<script type="text/javascript" src="../lib/jquery-3.2.1.min.js" ></script>
		<script type="text/javascript" src="drag.js" ></script>
		<link rel="stylesheet" type="text/css" href="../pcpublic.css"/>
		<style>
			body{
				background: #fff;
				height: 600px;
			}
			.sex,.age{
				text-align: center;
				width: 500px;
				padding-left: 20px;
				float: left;
			}
			.ui-drop{
				width: 227px;
				
			}
			.ui-drop input{
				height: 38px;
				line-height: 38px;
				border: 2px solid #ff8e42;
				cursor: pointer;
				width: 100px;
				padding: 0;
				font-size: 18px;
				text-align: center;
				position: absolute;
			}
			.ui-drop ul{
				width: 100%;
				position: absolute;
				top: 43px;
				left: 0;
				-moz-box-shadow:0px 1px 9px #949191; 
				-webkit-box-shadow:0px 1px 9px #949191;
				 box-shadow:0px 1px 9px #949191;
				 border-radius: 5px;
			}
			.ui-drop ul li{
				height: 38px;
				line-height: 38px;
			    color: #657180;
			    font-size: 18px;
			    cursor: pointer;
			     -moz-transition: all .3s ease;
			    -o-transition: all .3s ease;
			    -webkit-transition: all .3s ease;
			    transition: all .3s ease;
			}
			.ui-drop ul li:hover{
				background: #ededed;
			}
			.ui-drop ul li.cur{
				background: orange;
				color: #fff;
			}
			
		</style>
	</head>
	<body>
		<div class="sex">
		    <div class="ui-drop">
				<input type="text" readonly data-type="select" class="select" value="" placeholder="请选择"  id="bar"/>
				<ul style="display: none;">
					<li>男</li>
					<li>女</li>
					<li class="cur">女</li>
					<li>女</li>
					<li>女</li>
					<li>女</li>
				</ul>
			</div>
		</div>

		<script>
			window.onload = function(){
				var oBar = document.getElementById("bar");
				startDrag(oBar, oBar);
			};
		</script>
	</body>
</html>
