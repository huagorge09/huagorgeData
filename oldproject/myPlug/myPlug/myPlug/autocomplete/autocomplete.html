<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="x5-orientation" content="portrait"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
    <meta name="format-detection" content="telephone=no">
	<title></title>
	<script type="text/javascript" src="../lib/jquery-3.2.1.min.js" ></script>
	<script type="text/javascript" src="../lib/flexible.js" ></script>
    	<style type="text/css">
		.second select {  
		    width: 11%;  
		    height: 106px;  
		    margin: 0px;  
		    outline: none;  
		    border: 1px solid #999;  
		    margin-top: 31px;  
		}  
		.second input {  
		    width: 167px;  
		    top: 9px;  
		    outline: none;  
		    border: 0pt;  
		    position: absolute;  
		    line-height: 30px;  
		    left: 8px;  
		    height: 20px;  
		    border: 1px solid #999;
		}  
		.second ul {  
		    position: absolute;  
		    top: 27px;  
		    border: 1px solid #999;  
		    left: 8px;  
		    width: 125px;  
		    line-height: 16px;  
		}  
		.ul li{  
		    list-style: none;  
		    width: 161px;  
		    /* left: 15px; */  
		    margin-left: -40px;  
		    font-family: 微软雅黑;  
		    padding-left: 4px;  
		}  
		.blue {   
		    background:#1e91ff;   
		} 

	</style>

</head>
<body>

<span class="second">  
    <input type="text" name="makeupCo" id="makeupCo" class="makeinp" onfocus="setfocus(this)" oninput="setinput(this);" placeholder="请选择或输入"/>  
    <select name="makeupCoSe"  onchange="changeF(this)" size="10" style="display:none;">  
        <option value="1">1</option>
    </select>  
</span>  


<script type="text/javascript">
	function initInst(){
		$.ajax({
			// url: BASE_PATH + "/service/widget/queryMatchInstitution.do" ,     //后台处理程序
			   url: WIDGET_PATH_PREFIX + "queryMatchInstitution.do" ,
			    type: "post",               //数据发送方式
			    dataType: "json",           //接受数据格式   
			    data: {},                     //要传递的数据 
			    success:function(data){
			    	var html="";
                    for (var i;i<data.length;i++) {
                    	html+="<option value="+data.instLName+">"+data.instLName+"</option>";
                    }
                    $("select[name=makeupCoSe]").append(html)
			    }
		})
	} 
	var TempArr=[];//存储option  
	$(function(){  
	    /*先将数据存入数组*/  
	    $("#typenum option").each(function(index, el) {  
	        TempArr[index] = $(this).text();  
	    });  
	    $(document).bind('click', function(e) {    
	        var e = e || window.event; //浏览器兼容性     
	        var elem = e.target || e.srcElement;    
	        while (elem) { //循环判断至跟节点，防止点击的是div子元素     
	            if (elem.id && (elem.id == 'typenum' || elem.id == "makeupCo")) {    
	                return;    
	            }    
	            elem = elem.parentNode;    
	        }    
	        $('#typenum').css('display', 'none'); //点击的不是div或其子元素     
	    });    
	})  
	  
	function changeF(this_) {  
	    $(this_).prev("input").val($(this_).find("option:selected").text());  
	    $("#typenum").css({"display":"none"});  
	}  
	function setfocus(this_){  
	    $("#typenum").css({"display":""});  
	    var select = $("#typenum");  
	    for(i=0;i<TempArr.length;i++){  
	        var option = $("<option></option>").text(TempArr[i]);  
	        select.append(option);  
	    }
	    setinput(this_);   
	}  
	  
	function setinput(this_){  
	    var select = $("#typenum");  
	    select.html("");  
	    for(i=0;i<TempArr.length;i++){  
	        //若找到以txt的内容开头的，添option  
	        if(TempArr[i].substring(0,this_.value.length).indexOf(this_.value)==0){  
	            var option = $("<option></option>").text(TempArr[i]);  
	            select.append(option);  
	        }  
	    }  
	}  
</script>

	 
</body>
</html>
