<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<script type="text/javascript">
	//获取左侧菜单栏
	function getBuniessmgrMenu(){
			 $.ajax({
			    	async:false,
			        url: "/capitalService/menu/business.xhtml",
			        cache: false,
			        dataType: "json",
			        type : 'post',
			        error : function(textStatus, errorThrown) {  
			   				alert('系统内部错误');     	
			        }, 
			        success : function (data){
			        		if(data.resultState!="0000"){
			        			//菜单操作失败 使用隐藏模式								
			        			return;
			        		}
			        		var secondList=data.resultData.menuList;
			        		var html='';	
			        		for(var second=0;second<secondList.length;second++){
					        	//先注释second href "+secondList[second].href+"
					        	
					        	var thirdList=secondList[second].menuList;
					        	if(thirdList!=null&&thirdList.length==0){
					        		html+="<li class='final-menu'><a href='#' data-url='"+secondList[second].href+"' data-title='"+secondList[second].secname+"'><i class='"+secondList[second].icon+"'></i> <span class='nav-label'>"+secondList[second].secname+"</span> ";
					        	}else{
						        	html+="<li><a href='#'><i class='"+secondList[second].icon+"'></i> <span class='nav-label'>"+secondList[second].secname+"</span> ";
						        	if(thirdList!=null&&thirdList.length>0){
						        		html+="<span class='fa arrow'></span></a>";
						        		html+='<ul class="nav nav-second-level collapse" style="height: 0px;">';
						        		for(var third=0;third<thirdList.length;third++){
								        	var fourthList=thirdList[third].menuList;
								        	if(fourthList!=null&&fourthList.length>0){
							        			html+="<li ><a href='#'> <span class='nav-label'>"+thirdList[third].secname+"</span> ";
								        		html+="<span class='fa arrow'></span></a>";
								        		html+='<ul class="nav nav-third-level collapse" style="height: 0px;">';
								        		for(var fourth in fourthList){
								        			html+="<li class='final-menu'><a href='#' data-url='"+fourthList[fourth].href+"' data-title='"+fourthList[fourth].secname+"'><span class='nav-label'>"+fourthList[fourth].secname+"</span> </a></li>";		
								        		}
								        		html+='</ul></a></li>';
								        	}else{
							        			html+="<li class='final-menu'><a href='#' data-url='"+thirdList[third].href+"' data-title='"+thirdList[third].secname+"'><span class='nav-label'>"+thirdList[third].secname+"</span> ";
								        		html+='</a></li>';
								        	}
						        		}	
						        		html+="</ul></a></li>";
						        	}else{
						        		html+='</a></li>';
						        	}
					        	}
					        }
					        html+="";
					        $('#side-menu').html(html);
				   }
			    });
	}	
	getBuniessmgrMenu();
</script>
